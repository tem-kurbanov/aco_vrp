name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++ python3-venv shellcheck
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-analysis.txt
      - name: Configure and build with OpenMP
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE="$PWD/.venv/bin/python"
          cmake --build build --parallel 2
      - name: Run tests and input integrity checks
        run: ctest --test-dir build --output-on-failure
      - name: Check submission scripts
        run: |
          shellcheck submit_journal_experiments.sh submit_vrp_experiments.sh
          git diff --check
